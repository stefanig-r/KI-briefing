<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3dfd5;
  --accent:#c2410c; --accent-soft:#fdeee5; --us:#0f5f5c; --us-soft:#e4f2f1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --paper:#1f1f1c; --ink:#ecebe6; --muted:#a3a29a; --line:#33332e;
    --accent:#fb923c; --accent-soft:#3a2416; --us:#5eead4; --us-soft:#173330;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --paper:#1f1f1c; --ink:#ecebe6; --muted:#a3a29a; --line:#33332e;
  --accent:#fb923c; --accent-soft:#3a2416; --us:#5eead4; --us-soft:#173330;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.nav{display:flex;gap:6px;align-items:center}
.nav button,.nav select{font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.2;margin:28px 0 8px;letter-spacing:-.3px}
.date{color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-top:24px}
.intro{color:var(--muted);font-size:17px;margin:0 0 8px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.toc a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--paper)}
h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:40px 0 14px;display:flex;align-items:center;gap:10px}
h2 .n{font-family:Inter,sans-serif;font-size:12px;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 7px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px;line-height:1.35}
.card p{margin:0 0 10px}
.forus{background:var(--us-soft);border-left:3px solid var(--us);border-radius:6px;padding:10px 12px;font-size:15px}
.forus b{color:var(--us)}
.src{margin-top:10px;font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.src .lang{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.box{background:var(--us-soft);border-radius:12px;padding:18px 20px}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:8px}
.skill{background:var(--accent-soft);border-radius:12px;padding:20px}
.skill .meta{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:6px}
.skill ol{padding-left:20px}
.prompt{position:relative;background:var(--paper);border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.copy{margin-top:8px;font:inherit;font-size:13px;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.tools{display:grid;gap:12px}
.tool b{display:block;margin-bottom:4px}
.tool a{font-size:13px;color:var(--accent)}
footer{margin-top:48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.empty{padding:40px 0;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hidden{display:none !important}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.rules .card{margin:0}
.rules .num{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.formula{display:grid;gap:10px}
.formula .part{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.formula .part b{color:var(--accent)}
.formula .ex{font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
@media (max-width:520px){.formula .part{grid-template-columns:1fr;gap:2px}}
.levels{display:grid;gap:10px}
.level{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.level .lv{width:44px;height:44px;border-radius:50%;background:var(--us-soft);color:var(--us);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.level .nx{font-size:14px;color:var(--us);margin-top:4px}
.gsearch{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin-bottom:12px}
.gloss dt{font-weight:600;margin-top:14px}
.gloss dd{margin:2px 0 0;color:var(--ink)}
.gloss .none{color:var(--muted)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap}
@media (max-width:420px){.tabs button{padding:8px 10px;font-size:14px}}
.filter{display:flex;gap:6px;margin:20px 0 4px}
.filter button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.recap{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:0 20px}
details.recap summary{cursor:pointer;list-style:none;padding:16px 0}
details.recap summary::-webkit-details-marker{display:none}
details.recap .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
details.recap .tag.month{color:var(--us)}
details.recap .rh{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.3;font-weight:700}
details.recap .chev{float:right;color:var(--muted);transition:transform .2s}
details.recap[open] .chev{transform:rotate(90deg)}
details.recap .body{padding-bottom:18px}
details.recap ol{padding-left:20px}
details.recap ol li{margin-bottom:12px}
details.recap h4{margin:18px 0 6px;font-size:15px}
.roles{display:grid;gap:12px}
.roles .card{margin:0}
.rtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.role h4{margin:12px 0 4px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.role ul{margin:0;padding-left:20px}
.role .forus{margin-top:12px}
.role .forus ul{margin-top:4px}
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -16px;padding:0 16px;box-shadow:0 1px 0 var(--line)}
.sticky .tabs{margin-top:0;border-bottom:0;padding-top:4px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px}
.subtabs::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.subtabs:empty{display:none}
.subtabs button{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs .cnt{opacity:.6;margin-left:4px}
.panel{padding-top:8px}
.lead{padding-bottom:4px}
.lead h1{margin-top:12px}
.panel-title{font-family:Fraunces,Georgia,serif;font-size:22px;margin:14px 0 14px}
.newtag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.gloss .added{font-size:12px;color:var(--muted)}
.learn{margin-top:10px;padding-top:8px;border-top:1px dashed var(--us);font-size:14px}
.learn b{color:var(--us)}
.learn ul{margin:4px 0 0;padding-left:18px}
.learn a{color:var(--us)}
.learn .lang{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--muted)}
.lsub{font-family:Fraunces,Georgia,serif;font-size:19px;margin:26px 0 10px}
.prov{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.prov .card{margin:0}
.prov .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.stages{display:grid;gap:8px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stage b{color:var(--accent)}
.stage .ex{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1}
.mcpd{display:grid;grid-template-columns:1fr auto 1fr auto 1.4fr;gap:8px;align-items:center;margin:14px 0}
.mcpd .node{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:600;font-size:14px}
.mcpd .node.hub{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mcpd .tools{display:flex;flex-wrap:wrap;gap:6px}
.mcpd .tools span{font-size:12px;background:var(--us-soft);color:var(--us);border-radius:999px;padding:3px 9px}
.mcpd .ar{color:var(--muted)}
@media (max-width:560px){.mcpd{grid-template-columns:1fr}.mcpd .ar{transform:rotate(90deg);text-align:center}}
.myths{display:grid;gap:10px}
.myth{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.myth .m{color:var(--muted)}
.myth .m span{text-decoration:line-through}
.myth .m::before{content:"Mythos: ";text-decoration:none;font-weight:600}
.myth .f{margin-top:4px}
.myth .f::before{content:"Fakt: ";font-weight:600;color:var(--us)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">KI<span>-</span>Briefing</div>
      <div class="sub">Jeden Werktag um 7:30 · 5 Minuten Lesezeit</div>
    </div>
    <div class="nav">
      <button id="older" title="Ältere Ausgabe">←</button>
      <select id="picker" aria-label="Ausgabe wählen"></select>
      <button id="newer" title="Neuere Ausgabe">→</button>
    </div>
  </header>
  <div class="sticky">
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-briefing" aria-selected="true">Tägliches Briefing</button>
      <button role="tab" id="tab-recaps" aria-selected="false">Rückblick</button>
      <button role="tab" id="tab-basics" aria-selected="false">Grundwissen</button>
    </nav>
    <nav class="subtabs" id="subtabs" role="tablist" aria-label="Abschnitte"></nav>
  </div>
  <main id="main"><div class="empty">Lädt …</div></main>
  <section id="recaps" class="hidden"></section>
  <section id="basics" class="hidden"></section>
  <footer>Zusammengestellt mit KI aus öffentlichen Quellen. Bitte wichtige Fakten in den verlinkten Originalquellen prüfen.</footer>
</div>

<script src="editions.js"></script>
<script src="basics.js"></script>
<script src="recaps.js"></script>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
  function fmtShort(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('de-DE',{day:'numeric',month:'numeric',year:'numeric'});}
  function learn(list){
    if(!list||!list.length) return '';
    return '<div class="learn"><b>Hier informieren:</b><ul>'+list.map(function(l){return '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'+(l.lang?'<span class="lang">'+esc(l.lang)+'</span>':'')+'</li>';}).join('')+'</ul></div>';
  }
  function sources(list){
    if(!list||!list.length) return '';
    return '<div class="src">Quellen: '+list.map(function(s){return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a><span class="lang">EN</span>';}).join(' · ')+'</div>';
  }
  function ul(a){return '<ul>'+(a||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}

  var subnav=document.getElementById('subtabs');
  var sticky=document.querySelector('.sticky');
  var main=document.getElementById('main'), rsec=document.getElementById('recaps'), bsec=document.getElementById('basics');
  var nav=document.querySelector('header .nav');
  var picker=document.getElementById('picker'), older=document.getElementById('older'), newer=document.getElementById('newer');
  var current='briefing';

  // Each main tab registers: {el, lead (html), sections:[{id,label,count,html,after}], active}
  var views={};
  function mount(key){
    var v=views[key]; if(!v) return;
    var h=(v.lead||'');
    v.sections.forEach(function(s){ h+='<div class="panel'+(s.id===v.active?'':' hidden')+'" data-panel="'+s.id+'">'+s.html+'</div>'; });
    v.el.innerHTML=h;
    v.sections.forEach(function(s){ if(s.after) s.after(v.el.querySelector('[data-panel="'+s.id+'"]')); });
    if(key===current) drawSubnav();
  }
  function drawSubnav(){
    var v=views[current];
    if(!v||!v.sections.length){ subnav.innerHTML=''; return; }
    subnav.innerHTML=v.sections.map(function(s){
      return '<button role="tab" data-sub="'+s.id+'" aria-selected="'+(s.id===v.active)+'">'+esc(s.label)+(s.count!=null?'<span class="cnt">'+s.count+'</span>':'')+'</button>';
    }).join('');
    Array.prototype.forEach.call(subnav.querySelectorAll('button'),function(b){ b.onclick=function(){ selectSub(b.getAttribute('data-sub')); }; });
  }
  function selectSub(id){
    var v=views[current]; if(!v) return;
    v.active=id;
    Array.prototype.forEach.call(v.el.querySelectorAll('[data-panel]'),function(p){ p.classList.toggle('hidden',p.getAttribute('data-panel')!==id); });
    Array.prototype.forEach.call(subnav.querySelectorAll('button'),function(b){
      var on=b.getAttribute('data-sub')===id; b.setAttribute('aria-selected',on);
      if(on && b.scrollIntoView) try{ b.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){}
    });
    // keep the section start just below the sticky bar
    var top=v.el.querySelector('[data-panel="'+id+'"]').getBoundingClientRect().top+window.scrollY-sticky.offsetHeight-8;
    if(window.scrollY>top) window.scrollTo(0,top);
  }

  // ---------- Tägliches Briefing ----------
  var eds=(window.KI_BRIEFING_EDITIONS||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  eds.forEach(function(e,i){ var o=document.createElement('option'); o.value=i; o.textContent=(i===0?'Heute · ':'')+fmt(e.date); picker.appendChild(o); });

  function renderEdition(i){
    var e=eds[i], keep=views.briefing&&views.briefing.active;
    var secs=[];
    var h='';
    (e.news||[]).forEach(function(n){
      h+='<article class="card"><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p>'+(n.forUs?'<div class="forus"><b>Für uns:</b> '+esc(n.forUs)+learn(n.learn)+'</div>':learn(n.learn))+sources(n.sources)+'</article>';
    });
    secs.push({id:'news',label:'Was passiert ist',html:h});
    if(e.roles&&e.roles.length){
      h='<div class="roles">';
      e.roles.forEach(function(r){
        h+='<article class="card role"><span class="rtag">'+esc(r.role)+'</span><h3>'+esc(r.title)+'</h3><p>'+esc(r.text)+'</p>'+(r.tip?'<div class="forus"><b>Für Recruiting & Vertrieb:</b> '+esc(r.tip)+learn(r.learn)+'</div>':learn(r.learn))+sources(r.sources)+'</article>';
      });
      secs.push({id:'roles',label:'Rollen-Radar',html:h+'</div>'});
    }
    if(e.forUsBox){
      h='<div class="box"><b>'+esc(e.forUsBox.title)+'</b><ul style="margin-top:10px">'+(e.forUsBox.points||[]).map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>'+sources(e.forUsBox.sources)+'</div>';
      secs.push({id:'us',label:'Warum es für uns zählt',html:h});
    }
    if(e.tools&&e.tools.length){
      h='<div class="tools">'+e.tools.map(function(t){return '<div class="card tool"><b>'+esc(t.name)+'</b>'+esc(t.tip)+(t.url?'<div><a href="'+esc(t.url)+'" target="_blank" rel="noopener">Mehr erfahren →</a></div>':'')+'</div>';}).join('')+'</div>';
      secs.push({id:'tools',label:'Tool-Tipps',html:h});
    }
    var active=secs.some(function(s){return s.id===keep;})?keep:secs[0].id;
    views.briefing={el:main,lead:'<div class="lead"><div class="date">'+esc(fmt(e.date))+'</div><h1>'+esc(e.headline)+'</h1><p class="intro">'+esc(e.intro)+'</p></div>',sections:secs,active:active};
    mount('briefing');
    picker.value=i; newer.disabled=(i===0); older.disabled=(i===eds.length-1);
    if(current==='briefing'){ try{ history.replaceState(null,'','#'+e.date); }catch(err){} }
  }
  if(eds.length){
    picker.onchange=function(){renderEdition(+picker.value);window.scrollTo(0,0);};
    older.onclick=function(){renderEdition(+picker.value+1);window.scrollTo(0,0);};
    newer.onclick=function(){renderEdition(+picker.value-1);window.scrollTo(0,0);};
  } else {
    views.briefing={el:main,lead:'<div class="empty">Noch keine Ausgabe vorhanden.</div>',sections:[],active:null};
  }

  // ---------- Rückblick ----------
  var recaps=(window.KI_BRIEFING_RECAPS||[]).slice();
  function recapList(type){
    var list=recaps.filter(function(r){return type==='all'||r.type===type;});
    if(!list.length) return '<div class="empty">'+(type==='month'?'Der erste Monatsrückblick erscheint am letzten Werktag des Monats.':'Noch kein Rückblick vorhanden.')+'</div>';
    return list.map(function(r,i){
      var h='<details class="recap"'+(i===0?' open':'')+'><summary><span class="chev">›</span><span class="tag'+(r.type==='month'?' month':'')+'">'+(r.type==='month'?'Monat':'Woche')+' · '+esc(r.label)+'</span><div class="rh">'+esc(r.headline)+'</div></summary><div class="body">';
      h+='<p>'+esc(r.summary)+'</p><h4>Die wichtigsten Themen</h4><ol>';
      (r.top||[]).forEach(function(t){h+='<li><b>'+esc(t.title)+'</b><br>'+esc(t.text)+sources(t.sources)+'</li>';});
      h+='</ol>';
      if(r.trends&&r.trends.length) h+='<h4>Trends</h4>'+ul(r.trends);
      if(r.forUs&&r.forUs.length) h+='<div class="forus" style="margin-top:14px"><b>Für uns:</b>'+ul(r.forUs)+'</div>';
      return h+'</div></details>';
    }).join('');
  }
  views.recaps={el:rsec,lead:'<div class="lead"><h1>Rückblick</h1><p class="intro">Das Wichtigste der letzten Wochen und Monate – für alle, die nicht jeden Tag lesen.</p></div>',
    sections:[
      {id:'week',label:'Wochen',count:recaps.filter(function(r){return r.type==='week';}).length,html:recapList('week')},
      {id:'month',label:'Monate',count:recaps.filter(function(r){return r.type==='month';}).length,html:recapList('month')}
    ],active:'week'};
  mount('recaps');

  // ---------- Grundwissen ----------
  var b=window.KI_BRIEFING_BASICS;
  if(b){
    var secs=[], h;
    h='<div class="rules">'+(b.rules||[]).map(function(r,i){return '<div class="card"><span class="num">Regel '+(i+1)+'</span><h3>'+esc(r.title)+'</h3><p style="margin:0">'+esc(r.text)+'</p></div>';}).join('')+'</div>';
    secs.push({id:'g-rules',label:'Grundregeln',html:h});
    if(b.landscape){
      var L=b.landscape;
      h='<p>'+esc(L.intro)+'</p>';
      h+='<div class="lsub">Die wichtigsten Anbieter</div><div class="prov">'+(L.providers||[]).map(function(p){return '<div class="card"><h3 style="margin-bottom:2px">'+esc(p.name)+'</h3><div class="meta">'+esc(p.maker)+' · '+esc(p.origin)+'</div><p style="margin:0">'+esc(p.note)+'</p></div>';}).join('')+'</div>';
      if(L.providerNote) h+='<div class="forus" style="margin-top:12px"><b>Wichtig:</b> '+esc(L.providerNote)+'</div>';
      h+='<div class="lsub">Vom Chat zur Automatisierung</div><div class="stages">'+(L.stages||[]).map(function(s,i){return (i?'<div class="arrow">↓</div>':'')+'<div class="stage"><b>'+(i+1)+'. '+esc(s.name)+'</b><div>'+esc(s.text)+'</div><div class="ex">'+esc(s.example)+'</div></div>';}).join('')+'</div>';
      if(L.mcp){
        h+='<div class="lsub">'+esc(L.mcp.title)+'</div><p>'+esc(L.mcp.text)+'</p>';
        h+='<div class="mcpd" role="img" aria-label="KI-Assistent verbunden über MCP mit Tools"><div class="node">KI-Assistent</div><div class="ar">⇄</div><div class="node hub">MCP / Connector</div><div class="ar">⇄</div><div class="tools">'+(L.mcp.tools||[]).map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div></div>';
        h+=ul(L.mcp.why);
      }
      h+='<div class="lsub">Mythos oder Fakt?</div><div class="myths">'+(L.myths||[]).map(function(m){return '<div class="myth"><div class="m"><span>'+esc(m.myth)+'</span></div><div class="f">'+esc(m.fact)+'</div></div>';}).join('')+'</div>';
      h+='<p class="src">Stand: '+esc(L.asOf)+'</p>';
      secs.push({id:'g-map',label:'KI-Landkarte',html:h});
    }
    if(b.promptFormula){
      h='<p>'+esc(b.promptFormula.intro)+'</p><div class="formula">'+b.promptFormula.parts.map(function(p){return '<div class="part"><b>'+esc(p.name)+'</b><div>'+esc(p.text)+'<div class="ex">'+esc(p.example)+'</div></div></div>';}).join('')+'</div>';
      secs.push({id:'g-prompt',label:'Prompt-Formel',html:h});
    }
    h='<p>Wo stehst du – und was ist dein nächster Schritt?</p><div class="levels">'+(b.levels||[]).map(function(l){return '<div class="level"><div class="lv">'+esc(l.n)+'</div><div><b>'+esc(l.name)+'</b><div>'+esc(l.text)+'</div><div class="nx">Nächster Schritt: '+esc(l.next)+'</div></div></div>';}).join('')+'</div>';
    secs.push({id:'g-levels',label:'Reifegrad',html:h});
    if(b.roles&&b.roles.length){
      h='<p>Was KI in diesen Rollen übernimmt, was beim Menschen bleibt – und was man im Gespräch mit Kandidaten abfragen kann.</p><div class="roles">'+b.roles.map(function(r){
        return '<div class="card role"><span class="rtag">'+esc(r.role)+'</span><h3>'+esc(r.name)+'</h3><h4>KI übernimmt zunehmend</h4>'+ul(r.aiTakes)+'<h4>Bleibt beim Menschen</h4>'+ul(r.human)+'<div class="forus"><b>Im Gespräch fragen:</b>'+ul(r.ask)+'</div></div>';
      }).join('')+'</div>';
      secs.push({id:'g-roles',label:'Rollen im Wandel',html:h});
    }
    var terms=(b.glossary||[]).slice().sort(function(x,y){return x.term.localeCompare(y.term,'de');});
    var today=new Date();
    function isNew(t){ if(!t.added) return false; var p=t.added.split('-'); return (today-new Date(+p[0],+p[1]-1,+p[2]))/864e5<=30; }
    var newCount=terms.filter(isNew).length;
    secs.push({id:'g-gloss',label:'Glossar',count:terms.length,
      html:'<input class="gsearch" type="search" placeholder="Begriff suchen …" aria-label="Glossar durchsuchen">'+(newCount?'<p class="src" style="margin-top:0">'+newCount+' neue Begriffe in den letzten 30 Tagen, markiert mit <span class="newtag" style="margin:0">Neu</span></p>':'')+'<dl class="gloss"></dl><p class="src">Stand: '+esc(b.updated)+'</p>',
      after:function(panel){
        var dl=panel.querySelector('.gloss'), inp=panel.querySelector('.gsearch');
        function draw(q){
          q=(q||'').toLowerCase();
          var list=terms.filter(function(t){return !q||t.term.toLowerCase().indexOf(q)>-1||t.def.toLowerCase().indexOf(q)>-1;});
          // new terms first, then alphabetical
          list.sort(function(x,y){var a=isNew(x),c=isNew(y); if(a!==c) return a?-1:1; return x.term.localeCompare(y.term,'de');});
          dl.innerHTML=list.length?list.map(function(t){return '<dt>'+esc(t.term)+(isNew(t)?'<span class="newtag">Neu</span>':'')+'</dt><dd>'+esc(t.def)+(t.added?' <span class="added">· ergänzt am '+esc(fmtShort(t.added))+'</span>':'')+'</dd>';}).join(''):'<dd class="none">Kein Begriff gefunden.</dd>';
        }
        draw(''); inp.oninput=function(){draw(inp.value);};
      }});
    views.basics={el:bsec,lead:'<div class="lead"><h1>Grundwissen KI</h1><p class="intro">Das Wichtigste auf einen Blick – immer hier, unabhängig von der täglichen Ausgabe.</p></div>',sections:secs,active:'g-rules'};
  } else {
    views.basics={el:bsec,lead:'<div class="empty">Grundwissen konnte nicht geladen werden.</div>',sections:[],active:null};
  }
  mount('basics');

  // ---------- Haupt-Tabs ----------
  var tabBtns={briefing:document.getElementById('tab-briefing'),recaps:document.getElementById('tab-recaps'),basics:document.getElementById('tab-basics')};
  var hashes={recaps:'#rueckblick',basics:'#grundwissen'};
  function show(which){
    current=which;
    Object.keys(views).forEach(function(k){ views[k].el.classList.toggle('hidden',k!==which); tabBtns[k].setAttribute('aria-selected',k===which?'true':'false'); });
    if(nav) nav.style.display=(which==='briefing')?'':'none';
    drawSubnav();
    try{
      if(which==='briefing'){ if(eds.length) history.replaceState(null,'','#'+eds[+picker.value].date); }
      else history.replaceState(null,'',hashes[which]);
    }catch(err){}
    window.scrollTo(0,0);
  }
  Object.keys(tabBtns).forEach(function(k){ tabBtns[k].onclick=function(){show(k);}; });

  var hash=(location.hash||'').slice(1), start=0;
  eds.forEach(function(e,i){ if(e.date===hash) start=i; });
  if(eds.length) renderEdition(start); else mount('briefing');
  show(hash==='grundwissen'?'basics':hash==='rueckblick'?'recaps':'briefing');
})();
</script>
</body>
</html>
