<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --paper:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3dfd5;
  --accent:#c2410c; --accent-soft:#fdeee5; --us:#0f5f5c; --us-soft:#e4f2f1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161614; --paper:#1f1f1c; --ink:#ecebe6; --muted:#a3a29a; --line:#33332e;
    --accent:#fb923c; --accent-soft:#3a2416; --us:#5eead4; --us-soft:#173330;
  }
}
:root[data-theme="dark"]{
  --bg:#161614; --paper:#1f1f1c; --ink:#ecebe6; --muted:#a3a29a; --line:#33332e;
  --accent:#fb923c; --accent-soft:#3a2416; --us:#5eead4; --us-soft:#173330;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.5px;line-height:1}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.nav{display:flex;gap:6px;align-items:center}
.nav button,.nav select{font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.2;margin:28px 0 8px;letter-spacing:-.3px}
.date{color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-top:24px}
.intro{color:var(--muted);font-size:17px;margin:0 0 8px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
.toc a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--paper)}
h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:40px 0 14px;display:flex;align-items:center;gap:10px}
h2 .n{font-family:Inter,sans-serif;font-size:12px;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 7px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px;line-height:1.35}
.card p{margin:0 0 10px}
.forus{background:var(--us-soft);border-left:3px solid var(--us);border-radius:6px;padding:10px 12px;font-size:15px}
.forus b{color:var(--us)}
.src{margin-top:10px;font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.src .lang{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.box{background:var(--us-soft);border-radius:12px;padding:18px 20px}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:8px}
.skill{background:var(--accent-soft);border-radius:12px;padding:20px}
.skill .meta{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:6px}
.skill ol{padding-left:20px}
.prompt{position:relative;background:var(--paper);border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.copy{margin-top:8px;font:inherit;font-size:13px;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.tools{display:grid;gap:12px}
.tool b{display:block;margin-bottom:4px}
.tool a{font-size:13px;color:var(--accent)}
footer{margin-top:48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.empty{padding:40px 0;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:15px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hidden{display:none !important}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.rules .card{margin:0}
.rules .num{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.formula{display:grid;gap:10px}
.formula .part{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.formula .part b{color:var(--accent)}
.formula .ex{font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
@media (max-width:520px){.formula .part{grid-template-columns:1fr;gap:2px}}
.levels{display:grid;gap:10px}
.level{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.level .lv{width:44px;height:44px;border-radius:50%;background:var(--us-soft);color:var(--us);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.level .nx{font-size:14px;color:var(--us);margin-top:4px}
.gsearch{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin-bottom:12px}
.gloss dt{font-weight:600;margin-top:14px}
.gloss dd{margin:2px 0 0;color:var(--ink)}
.gloss .none{color:var(--muted)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap}
@media (max-width:420px){.tabs button{padding:8px 10px;font-size:14px}}
.filter{display:flex;gap:6px;margin:20px 0 4px}
.filter button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.recap{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:0 20px}
details.recap summary{cursor:pointer;list-style:none;padding:16px 0}
details.recap summary::-webkit-details-marker{display:none}
details.recap .tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
details.recap .tag.month{color:var(--us)}
details.recap .rh{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.3;font-weight:700}
details.recap .chev{float:right;color:var(--muted);transition:transform .2s}
details.recap[open] .chev{transform:rotate(90deg)}
details.recap .body{padding-bottom:18px}
details.recap ol{padding-left:20px}
details.recap ol li{margin-bottom:12px}
details.recap h4{margin:18px 0 6px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">KI<span>-</span>Briefing</div>
      <div class="sub">Jeden Werktag um 7:30 · 5 Minuten Lesezeit</div>
    </div>
    <div class="nav">
      <button id="older" title="Ältere Ausgabe">←</button>
      <select id="picker" aria-label="Ausgabe wählen"></select>
      <button id="newer" title="Neuere Ausgabe">→</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-briefing" aria-selected="true">Tägliches Briefing</button>
    <button role="tab" id="tab-recaps" aria-selected="false">Rückblick</button>
    <button role="tab" id="tab-basics" aria-selected="false">Grundwissen</button>
  </nav>
  <main id="main"><div class="empty">Lädt …</div></main>
  <section id="recaps" class="hidden"></section>
  <section id="basics" class="hidden"></section>
  <footer>Zusammengestellt mit KI aus öffentlichen Quellen. Bitte wichtige Fakten in den verlinkten Originalquellen prüfen.</footer>
</div>

<script src="editions.js"></script>
<script src="basics.js"></script>
<script src="recaps.js"></script>
<script>
(function(){
  var eds = (window.KI_BRIEFING_EDITIONS || []).slice().sort(function(a,b){return a.date < b.date ? 1 : -1;});
  var main = document.getElementById('main');
  var picker = document.getElementById('picker');
  var older = document.getElementById('older');
  var newer = document.getElementById('newer');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(d){
    var p=d.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]);
    return dt.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  function sources(list){
    if(!list||!list.length) return '';
    return '<div class="src">Quellen: '+list.map(function(s){
      return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a><span class="lang">EN</span>';
    }).join(' · ')+'</div>';
  }

  if(!eds.length){ main.innerHTML='<div class="empty">Noch keine Ausgabe vorhanden.</div>'; return; }

  eds.forEach(function(e,i){
    var o=document.createElement('option'); o.value=i; o.textContent=(i===0?'Heute · ':'')+fmt(e.date); picker.appendChild(o);
  });

  function render(i){
    var e=eds[i]; var h='';
    h+='<div class="date">'+esc(fmt(e.date))+'</div>';
    h+='<h1>'+esc(e.headline)+'</h1>';
    h+='<p class="intro">'+esc(e.intro)+'</p>';
    h+='<nav class="toc"><a href="#news">Was passiert ist</a><a href="#us">Warum es für uns zählt</a><a href="#skill">Skill des Tages</a><a href="#tools">Tool-Tipps</a></nav>';

    h+='<h2 id="news"><span class="n">1</span>Was passiert ist</h2>';
    (e.news||[]).forEach(function(n){
      h+='<article class="card"><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p>';
      if(n.forUs) h+='<div class="forus"><b>Für uns:</b> '+esc(n.forUs)+'</div>';
      h+=sources(n.sources)+'</article>';
    });

    if(e.forUsBox){
      h+='<h2 id="us"><span class="n">2</span>Warum es für uns zählt</h2>';
      h+='<div class="box"><b>'+esc(e.forUsBox.title)+'</b><ul style="margin-top:10px">';
      (e.forUsBox.points||[]).forEach(function(p){h+='<li>'+esc(p)+'</li>';});
      h+='</ul>'+sources(e.forUsBox.sources)+'</div>';
    }

    if(e.skill){
      var s=e.skill;
      h+='<h2 id="skill"><span class="n">3</span>Skill des Tages</h2>';
      h+='<div class="skill"><div class="meta">⏱ '+esc(s.minutes)+' Minuten Übung</div><h3 style="margin:0 0 8px">'+esc(s.title)+'</h3><p>'+esc(s.why)+'</p><ol>';
      (s.steps||[]).forEach(function(st){h+='<li>'+esc(st)+'</li>';});
      h+='</ol>';
      if(s.prompt) h+='<div class="prompt" id="prompt">'+esc(s.prompt)+'</div><button class="copy" id="copy">Auftrag kopieren</button>';
      h+='</div>';
    }

    if(e.tools&&e.tools.length){
      h+='<h2 id="tools"><span class="n">4</span>Tool-Tipps</h2><div class="tools">';
      e.tools.forEach(function(t){
        h+='<div class="card tool"><b>'+esc(t.name)+'</b>'+esc(t.tip)+(t.url?'<div><a href="'+esc(t.url)+'" target="_blank" rel="noopener">Mehr erfahren →</a></div>':'')+'</div>';
      });
      h+='</div>';
    }

    main.innerHTML=h;
    picker.value=i; newer.disabled=(i===0); older.disabled=(i===eds.length-1);
    var c=document.getElementById('copy');
    if(c) c.onclick=function(){
      var t=document.getElementById('prompt').textContent;
      try{ navigator.clipboard.writeText(t).then(function(){c.textContent='Kopiert ✓';}); }
      catch(err){ c.textContent='Bitte manuell kopieren'; }
    };
    try{ history.replaceState(null,'','#'+e.date); }catch(err){}
    window.scrollTo(0,0);
  }

  picker.onchange=function(){render(+picker.value);};
  older.onclick=function(){render(+picker.value+1);};
  newer.onclick=function(){render(+picker.value-1);};

  var start=0, hash=(location.hash||'').slice(1);
  eds.forEach(function(e,i){ if(e.date===hash) start=i; });
  window.KI_INITIAL_HASH = location.hash;
  render(start);
})();
</script>
<script>
(function(){
  var b = window.KI_BRIEFING_BASICS;
  var sec = document.getElementById('basics');
  var main = document.getElementById('main');
  var nav = document.querySelector('header .nav');
  var tBrief = document.getElementById('tab-briefing');
  var tBasics = document.getElementById('tab-basics');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  if(b){
    var h='<h1>Grundwissen KI</h1><p class="intro">Das Wichtigste auf einen Blick – immer hier, unabhängig von der täglichen Ausgabe.</p>';
    h+='<nav class="toc"><a href="#g-rules">Grundregeln</a><a href="#g-prompt">Prompt-Formel</a><a href="#g-levels">Reifegrad</a><a href="#g-gloss">Glossar</a></nav>';

    h+='<h2 id="g-rules"><span class="n">1</span>Grundregeln</h2><div class="rules">';
    (b.rules||[]).forEach(function(r,i){ h+='<div class="card"><span class="num">Regel '+(i+1)+'</span><h3>'+esc(r.title)+'</h3><p style="margin:0">'+esc(r.text)+'</p></div>'; });
    h+='</div>';

    if(b.promptFormula){
      h+='<h2 id="g-prompt"><span class="n">2</span>Prompt-Formel</h2><p>'+esc(b.promptFormula.intro)+'</p><div class="formula">';
      b.promptFormula.parts.forEach(function(p){ h+='<div class="part"><b>'+esc(p.name)+'</b><div>'+esc(p.text)+'<div class="ex">'+esc(p.example)+'</div></div></div>'; });
      h+='</div>';
    }

    h+='<h2 id="g-levels"><span class="n">3</span>Reifegrad: Wo stehst du?</h2><div class="levels">';
    (b.levels||[]).forEach(function(l){ h+='<div class="level"><div class="lv">'+esc(l.n)+'</div><div><b>'+esc(l.name)+'</b><div>'+esc(l.text)+'</div><div class="nx">Nächster Schritt: '+esc(l.next)+'</div></div></div>'; });
    h+='</div>';

    h+='<h2 id="g-gloss"><span class="n">4</span>Glossar</h2><input class="gsearch" id="gsearch" type="search" placeholder="Begriff suchen …" aria-label="Glossar durchsuchen"><dl class="gloss" id="gloss"></dl>';
    h+='<p class="src">Stand: '+esc(b.updated)+'</p>';
    sec.innerHTML=h;

    var terms=(b.glossary||[]).slice().sort(function(x,y){return x.term.localeCompare(y.term,'de');});
    var dl=document.getElementById('gloss');
    function drawGloss(q){
      q=(q||'').toLowerCase();
      var list=terms.filter(function(t){return !q || t.term.toLowerCase().indexOf(q)>-1 || t.def.toLowerCase().indexOf(q)>-1;});
      dl.innerHTML=list.length ? list.map(function(t){return '<dt>'+esc(t.term)+'</dt><dd>'+esc(t.def)+'</dd>';}).join('') : '<dd class="none">Kein Begriff gefunden.</dd>';
    }
    drawGloss('');
    document.getElementById('gsearch').oninput=function(e){drawGloss(e.target.value);};
  } else {
    sec.innerHTML='<div class="empty">Grundwissen konnte nicht geladen werden.</div>';
  }

  // --- Rückblick ---
  var rsec=document.getElementById('recaps');
  var tRecaps=document.getElementById('tab-recaps');
  var recaps=(window.KI_BRIEFING_RECAPS||[]).slice();
  var rFilter='all';
  function srcs(list){
    if(!list||!list.length) return '';
    return '<div class="src">Quellen: '+list.map(function(s){return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a><span class="lang">EN</span>';}).join(' · ')+'</div>';
  }
  function drawRecaps(){
    var h='<h1>Rückblick</h1><p class="intro">Das Wichtigste der letzten Wochen und Monate – für alle, die nicht jeden Tag lesen.</p>';
    h+='<div class="filter" role="group" aria-label="Filter">'+
      [['all','Alle'],['week','Wochen'],['month','Monate']].map(function(f){return '<button data-f="'+f[0]+'" aria-pressed="'+(rFilter===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>';
    var list=recaps.filter(function(r){return rFilter==='all'||r.type===rFilter;});
    if(!list.length){
      h+='<div class="empty">'+(rFilter==='month'?'Der erste Monatsrückblick erscheint am letzten Werktag des Monats.':'Noch kein Rückblick vorhanden.')+'</div>';
    }
    list.forEach(function(r,i){
      h+='<details class="recap"'+(i===0?' open':'')+'><summary><span class="chev">›</span><span class="tag'+(r.type==='month'?' month':'')+'">'+(r.type==='month'?'Monat':'Woche')+' · '+esc(r.label)+'</span><div class="rh">'+esc(r.headline)+'</div></summary><div class="body">';
      h+='<p>'+esc(r.summary)+'</p><h4>Die wichtigsten Themen</h4><ol>';
      (r.top||[]).forEach(function(t){h+='<li><b>'+esc(t.title)+'</b><br>'+esc(t.text)+srcs(t.sources)+'</li>';});
      h+='</ol>';
      if(r.trends&&r.trends.length){h+='<h4>Trends</h4><ul>'+r.trends.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';}
      if(r.forUs&&r.forUs.length){h+='<div class="forus" style="margin-top:14px"><b>Für uns:</b><ul style="margin:6px 0 0;padding-left:18px">'+r.forUs.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>';}
      h+='</div></details>';
    });
    rsec.innerHTML=h;
    Array.prototype.forEach.call(rsec.querySelectorAll('.filter button'),function(btn){btn.onclick=function(){rFilter=btn.getAttribute('data-f');drawRecaps();};});
  }
  drawRecaps();

  // --- Tabs ---
  var lastHash='';
  var tabs={briefing:{btn:tBrief,el:main},recaps:{btn:tRecaps,el:rsec,hash:'#rueckblick'},basics:{btn:tBasics,el:sec,hash:'#grundwissen'}};
  function show(which){
    Object.keys(tabs).forEach(function(k){
      var on=(k===which);
      tabs[k].el.classList.toggle('hidden',!on);
      tabs[k].btn.setAttribute('aria-selected',on?'true':'false');
    });
    if(nav) nav.style.display=(which==='briefing')?'':'none';
    try{
      if(which==='briefing'){ if(lastHash) history.replaceState(null,'',lastHash); }
      else { if(!/^#(grundwissen|rueckblick)$/.test(location.hash)) lastHash=location.hash; history.replaceState(null,'',tabs[which].hash); }
    }catch(err){}
    window.scrollTo(0,0);
  }
  window.KI_SHOW_TAB=show;
  tBrief.onclick=function(){show('briefing');};
  tRecaps.onclick=function(){show('recaps');};
  tBasics.onclick=function(){show('basics');};
  var ih=window.KI_INITIAL_HASH||location.hash;
  if(ih==='#grundwissen'){ show('basics'); } else if(ih==='#rueckblick'){ show('recaps'); }
})();
</script>
</body>
</html>
